<!DOCTYPE html>
<html>
<head>
    <title>Litera - Bug Fix Test</title>
</head>
<body>
    <h1>Litera Test</h1>
    <div id="result"></div>
    
    <script type="module">
        import { ComparisonEngine } from './js/comparisonEngine.js';
        
        const engine = new ComparisonEngine();
        
        // Test the fix
        const doc1 = `Line 1
Line 2 to modify
Line 3`;
        
        const doc2 = `Line 1
Modified Line 2
Line 3`;
        
        const changes = engine.compare(doc1, doc2);
        
        document.getElementById('result').innerHTML = `
            <p>Changes detected: ${changes.length}</p>
            <pre>${JSON.stringify(changes, null, 2)}</pre>
        `;
        
        console.log('Test complete. Changes:', changes);
    </script>
</body>
</html>
