<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litera Rebuild - Document Redlining</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🔴</span>
                <h1>Litera Rebuild</h1>
            </div>
            <div class="actions">
                <button id="upload-btn" class="btn primary">📄 Upload Document</button>
                <button id="compare-btn" class="btn secondary" disabled>🔍 Compare</button>
                <button id="export-btn" class="btn secondary" disabled>💾 Export</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Sidebar -->
            <aside class="sidebar">
                <h3>Changes</h3>
                <div class="filter-bar">
                    <button class="filter-btn active" data-type="all">All</button>
                    <button class="filter-btn" data-type="add">Added</button>
                    <button class="filter-btn" data-type="remove">Removed</button>
                </div>
                <div id="changes-list" class="changes-list">
                    <p class="empty">No changes detected yet</p>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Changes:</span>
                        <span id="total-changes" class="stat-value">0</span>
                    </div>
                </div>
            </aside>

            <!-- Document View -->
            <section class="document-container">
                <div class="toolbar">
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="unified">Unified</button>
                        <button class="view-btn" data-view="split">Split</button>
                    </div>
                    <div class="zoom-controls">
                        <button id="zoom-out">-</button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in">+</button>
                    </div>
                </div>
                
                <div id="document-view" class="document-view">
                    <div class="drop-zone" id="drop-zone">
                        <div class="drop-content">
                            <span class="drop-icon">📄</span>
                            <p>Drag & drop documents here</p>
                            <p class="drop-hint">or click to browse</p>
                            <input type="file" id="file-input" accept=".txt,.docx,.pdf" hidden>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Hidden input for second document in compare mode -->
    <input type="file" id="file-input-2" accept=".txt,.docx,.pdf" hidden>

    <script src="js/app.js" type="module"></script>
</body>
</html>
